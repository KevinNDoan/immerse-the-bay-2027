<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZAP! logo animation</title>
<style>
  /* Drop this file into the demo site, or copy the <canvas> and <script> into a page.
     The canvas fills its container and keeps the logo centred; click it to replay. */
  html, body { margin: 0; height: 100%; background: #DADEE3; }
  #zap-logo { display: block; width: 100%; height: 100%; cursor: pointer; }
</style>
</head>
<body>
<canvas id="zap-logo" aria-label="ZAP! logo" role="img"></canvas>
<script>
(() => {
  // Final ZAP! logo (Figma, Wordmark page): Gabarito Black on bouncing baselines, bolt as the "!",
  // lightning yellow with an ink channel up-left and a rose channel down-right. No lines on the letters.
  const COLORS = { yellow: '#FFD60A', ink: '#14121C', rose: '#E0517E', silver: '#DADEE3' };
  const PARTS = [
    { name: 'Z', x: 214.94, y: 74.24, w: 98.86, h: 125.13, d: 'M 63.76 17.64 L 62.48 32.34 L 1.29 32.34 L 1.29 0 L 98.12 0 L 98.12 22.6 L 34.73 107.86 L 27.01 92.79 L 98.86 92.79 L 98.86 125.13 L 0 125.13 L 0 102.35 L 63.76 17.64 Z' },
    { name: 'A', x: 309.42, y: 96.74, w: 117.78, h: 125.13, d: 'M 30.32 75.71 L 82.69 75.71 L 82.69 106.39 L 30.32 106.39 L 30.32 75.71 Z M 0 125.13 L 44.28 0 L 77.54 0 L 117.78 125.13 L 84.34 125.13 L 54.39 22.6 L 67.62 22.6 L 33.26 125.13 L 0 125.13 Z' },
    { name: 'P', x: 426.85, y: 79.87, w: 96.1, h: 125.13, d: 'M 25.36 62.66 L 45.2 62.66 C 50.84 62.66 55.06 61.37 57.88 58.8 C 60.82 56.23 62.29 52.49 62.29 47.59 C 62.29 42.57 60.82 38.77 57.88 36.2 C 55.06 33.63 50.84 32.34 45.2 32.34 L 25.17 32.34 L 33.26 25.17 L 33.26 125.13 L 0 125.13 L 0 0 L 46.31 0 C 56.23 0 64.93 1.84 72.4 5.51 C 79.87 9.07 85.69 14.39 89.85 21.5 C 94.02 28.48 96.1 37.18 96.1 47.59 C 96.1 58 94.02 66.76 89.85 73.87 C 85.69 80.85 79.87 86.18 72.4 89.85 C 64.93 93.41 56.23 95.18 46.31 95.18 L 25.36 95.18 L 25.36 62.66 Z' },
    { name: 'bolt', x: 0, y: 0, w: 0, h: 0, d: 'M 584.34 66.22 L 531 126.88 L 560.55 132.09 L 542.83 180.75 L 600.17 114.71 L 570.62 109.5 Z' },
  ];
  const BOLT_BOX = { x: 531, y: 66.22, w: 69.17, h: 114.53 };
  const CH_INK = [-8.44, -2.81], CH_ROSE = [7.5, 3.75];
  const LOGO_CENTER = [407.5, 144];        // centre of the art in Figma coordinates
  const STAGE_W = 1920, STAGE_H = 1080;    // virtual stage; the logo is drawn about 900 px wide on it
  const LOGO_SCALE = 2.35;
  const BOLT_IN = .1, BOLT_TIME = .55;     // the bolt glides down and settles
  const LETTER_IN = { Z: .55, A: .72, P: .89 }, LETTER_TIME = .55;
  const SETTLE_START = .5, SETTLE_END = 2.0; // channels slide from wide apart into register
  const DURATION = 3.6;                    // seconds until the logo is settled and holding

  const canvas = document.getElementById('zap-logo');
  const ctx = canvas.getContext('2d');
  const paths = PARTS.map(p => ({ ...p, path: new Path2D(p.d) }));
  const recording = new URLSearchParams(location.search).has('record');
  let start = performance.now(), dpr = 1, raf = 0;

  const clamp01 = v => Math.max(0, Math.min(1, v));
  const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
  const easeInOutSine = t => -(Math.cos(Math.PI * t) - 1) / 2;
  const easeOutBack = (t, c = 1.25) => 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2);

  function resize() {
    dpr = recording ? 1 : (window.devicePixelRatio || 1);
    const w = recording ? STAGE_W : canvas.clientWidth, h = recording ? STAGE_H : canvas.clientHeight;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    if (recording) { canvas.style.width = STAGE_W + 'px'; canvas.style.height = STAGE_H + 'px'; }
  }

  // Fit the 16:9 stage inside the canvas, then place the logo in its centre.
  function stageTransform() {
    const s = Math.min(canvas.width / STAGE_W, canvas.height / STAGE_H);
    ctx.setTransform(s, 0, 0, s, (canvas.width - STAGE_W * s) / 2, (canvas.height - STAGE_H * s) / 2);
    ctx.translate(STAGE_W / 2, STAGE_H / 2); ctx.scale(LOGO_SCALE, LOGO_SCALE); ctx.translate(-LOGO_CENTER[0], -LOGO_CENTER[1]);
  }

  // Plain silver background, no lines.
  function drawBackground() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = COLORS.silver; ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // Where each part is at time t: returns its opacity, after applying its motion to the canvas.
  function placePart(p, t) {
    if (p.name === 'bolt') {
      const u = clamp01((t - BOLT_IN) / BOLT_TIME); if (u <= 0) return 0;
      const cx = BOLT_BOX.x + BOLT_BOX.w / 2, cy = BOLT_BOX.y + BOLT_BOX.h / 2;
      const k = easeOutBack(u, 1.1);
      ctx.translate(cx, cy + (1 - k) * -180); ctx.rotate((1 - easeOutCubic(u)) * -.18); ctx.translate(-cx, -cy);
      return easeOutCubic(clamp01(u * 2.2));
    }
    const u = clamp01((t - LETTER_IN[p.name]) / LETTER_TIME); if (u <= 0) return 0;
    const k = .55 + .45 * easeOutBack(u), cx = p.x + p.w / 2, cy = p.y + p.h / 2;
    ctx.translate(cx, cy + (1 - easeOutCubic(u)) * 26); ctx.scale(k, k); ctx.translate(-cx, -cy);
    ctx.translate(p.x, p.y);
    return easeOutCubic(clamp01(u * 1.8));
  }

  function drawLogo(t) {
    // Channels start wide apart and glide smoothly into register; then they drift very slightly.
    const settle = easeInOutSine(clamp01((t - SETTLE_START) / (SETTLE_END - SETTLE_START)));
    const spread = 3.2 - 2.2 * settle;
    const breathe = t > SETTLE_END ? 1 + .12 * Math.sin((t - SETTLE_END) * 1.6) * clamp01((t - SETTLE_END) / .8) : 1;
    const layers = [[COLORS.ink, CH_INK, spread * breathe], [COLORS.rose, CH_ROSE, spread * breathe], [COLORS.yellow, [0, 0], 0]];
    for (const [color, offset, m] of layers) {
      for (const p of paths) {
        stageTransform(); ctx.translate(offset[0] * m, offset[1] * m);
        const alpha = placePart(p, t); if (alpha <= 0) continue;
        ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.fill(p.path, 'nonzero');
      }
    }
    ctx.globalAlpha = 1;
  }

  function render(now) {
    const t = (now - start) / 1000;
    drawBackground();
    drawLogo(t);
    if (recording && t > DURATION + 1) { finishRecording(); return; }
    raf = requestAnimationFrame(render);
  }

  function play() { cancelAnimationFrame(raf); start = performance.now(); raf = requestAnimationFrame(render); }

  // ---- Recording (open with ?record): records one play at 1920x1080 and posts it to the local helper.
  let recorder, chunks = [], finished = false;
  async function startRecording() {
    const stream = canvas.captureStream(60);
    try {
      const audio = new AudioContext(); await audio.resume();
      const clip = await audio.decodeAudioData(await (await fetch('zap_connect.wav')).arrayBuffer());
      const dest = audio.createMediaStreamDestination();
      const src = audio.createBufferSource(); src.buffer = clip; src.connect(dest);
      src.start(audio.currentTime + BOLT_IN + BOLT_TIME * .55);   // zap as the bolt lands
      dest.stream.getAudioTracks().forEach(tr => stream.addTrack(tr));
    } catch (e) { console.warn('recording without sound:', e); }
    const types = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'];
    const mime = types.find(m => MediaRecorder.isTypeSupported(m));
    recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 16_000_000 });
    recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
    recorder.onstop = async () => {
      const blob = new Blob(chunks, { type: mime });
      const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
      const res = await fetch('/upload?name=zap_logo_end.' + ext, { method: 'POST', body: blob });
      document.title = 'saved ' + ext + ' ' + blob.size + ' ' + res.status;
    };
    recorder.start(); play();
  }
  function finishRecording() { if (finished) return; finished = true; recorder && recorder.state !== 'inactive' && recorder.stop(); }

  resize(); window.addEventListener('resize', () => { if (!recording) resize(); });
  canvas.addEventListener('click', play);
  if (recording) { window.zapStartRecording = startRecording; drawBackground(); }
  else play();
})();
</script>
</body>
</html>
