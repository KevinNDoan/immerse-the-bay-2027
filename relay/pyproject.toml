[project]
name = "zap-relay"
version = "0.1.0"
description = "ZAP! relay: stand-in video and live Orbis for the headset and the judges' page."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pillow>=10.1",
    "numpy",
    "python-dotenv",
]

[project.optional-dependencies]
live = ["reactor-sdk>=1.14.0"]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "websockets",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zap_relay"]

[tool.hatch.build.targets.wheel.force-include]
"zap_relay/static/index.html" = "zap_relay/static/index.html"

[tool.pytest.ini_options]
testpaths = ["tests"]
