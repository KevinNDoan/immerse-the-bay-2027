<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZAP! live world</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #07070c; color: #fff; }
    main { width: min(100% - 32px, 1040px); margin: 0 auto; padding: 36px 0 56px; }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; }
    h1 { margin: 0 0 22px; letter-spacing: .08em; font-size: 28px; }
    #status { color: #b9b9c7; }
    img { display: block; width: 100%; aspect-ratio: 832 / 480; object-fit: contain; background: #101018; border: 1px solid #343440; }
    h2 { margin: 26px 0 8px; font-size: 14px; color: #b9b9c7; text-transform: uppercase; letter-spacing: .1em; }
    #prompt { min-height: 64px; margin: 0; white-space: pre-wrap; font-size: 19px; line-height: 1.45; }
    form { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-top: 24px; }
    input, button { border: 1px solid #454551; border-radius: 6px; font: inherit; }
    input { padding: 13px 14px; background: #111119; color: #fff; }
    button { padding: 0 20px; background: #fff; color: #07070c; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .45; cursor: wait; }
  </style>
</head>
<body>
  <main>
    <header><h1>ZAP!</h1><span id="status">connecting</span></header>
    <img src="/stream.mjpg" alt="Live generated world">
    <h2>Prompt in force</h2>
    <p id="prompt">Waiting for a world…</p>
    <form id="steer-form">
      <input id="steer" aria-label="Steering instruction" placeholder="Ask the world to change…" autocomplete="off">
      <button id="send" type="submit">Steer</button>
    </form>
  </main>
  <script>
    const status = document.querySelector('#status');
    const prompt = document.querySelector('#prompt');
    const input = document.querySelector('#steer');
    const send = document.querySelector('#send');
    let socket;
    let startedDemo = false;

    function connect() {
      startedDemo = false;
      const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
      socket = new WebSocket(`${scheme}://${location.host}/ws/world`);
      socket.addEventListener('message', event => {
        if (typeof event.data !== 'string') return;
        const message = JSON.parse(event.data);
        if (message.t === 'status') {
          status.textContent = message.state;
          if (message.state === 'idle' && !startedDemo) {
            startedDemo = true;
            socket.send(JSON.stringify({t: 'enter', nodeId: 'judges', topic: 'ZAP! demo world', prompt: '', image: ''}));
          }
        }
        if (message.t === 'prompt') prompt.textContent = message.text;
        if (message.t === 'error') status.textContent = `error: ${message.detail}`;
      });
      socket.addEventListener('close', () => { status.textContent = 'disconnected'; setTimeout(connect, 1000); });
    }
    document.querySelector('#steer-form').addEventListener('submit', event => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text || socket.readyState !== WebSocket.OPEN) return;
      socket.send(JSON.stringify({t: 'steer', kind: 'event', text}));
      input.value = '';
      send.disabled = true;
      setTimeout(() => { send.disabled = false; }, 1800);
    });
    connect();
  </script>
</body>
</html>
